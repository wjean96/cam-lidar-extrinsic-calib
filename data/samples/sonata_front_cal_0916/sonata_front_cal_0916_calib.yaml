  rvec_cam_lidar: [1.212782, -1.197185, 1.201528]           # Rodrigues, for cv2.projectPoints
  quaternion_cam_lidar_xyzw: [0.502357, -0.495896, 0.497696, 0.504007]

  # camera -> LiDAR (inverse; camera position expressed in the LiDAR frame)
